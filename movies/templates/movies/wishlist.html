{% extends "base.html" %}
{% block content %}
{% load static %}
<div class="p-3">
  <div class="container">
    <div class="row mt-3">
      <div class="col mx-auto mb-3">
        <h2>Your Wishlist</h2>
        <hr />
      </div>
    </div>
    {% if movies %}
    <div class="row">
      {% for movie in movies %}
      <div class="col-md-4 col-lg-3 mb-2">
        <div class="p-2 card align-items-center pt-4">
          <img src="{{ movie.image.url }}"
            class="card-img-top rounded img-card-200">
          <div class="card-body text-center">
            <a href="{% url 'movies:show' id=movie.id %}"
              class="btn bg-dark text-white">
              {{ movie.name }}
            </a>
            <p class="mt-2 mb-2"><b>Price:</b> ${{ movie.price }}</p>
            <form method="post" action="{% url 'movies:toggle_wishlist' movie.pk %}" class="mt-2">
              {% csrf_token %}
              <input type="hidden" name="next" value="{% url 'movies:wishlist' %}">
              <button type="submit" class="btn btn-outline-danger btn-sm">Remove from Wishlist</button>
            </form>
          </div>
        </div>
      </div>
      {% endfor %}
    </div>
    {% else %}
    <div class="row">
      <div class="col mx-auto mb-3">
        <p>Your wishlist is empty.</p>
      </div>
    </div>
    {% endif %}
  </div>
</div>
{% endblock %}
