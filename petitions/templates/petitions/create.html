{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="container my-4">
    <h1>Create a Petition</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" type="submit">Submit Petition</button>
        <a href="{% url 'petition_list' %}">Back to petition list</a>
    </form>
</div>
{% endblock %}
